<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR - Vídeo do Instagram</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #video-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 22px;
      border-radius: 40px;
      text-align: center;
    }

    #video-overlay a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #video-overlay a::before {
      content: "▶";
    }

    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
    }

    #unmute-btn {
      display: none;
      position: fixed;
      z-index: 999;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div id="hint">Aponte a câmera para a imagem</div>

  <button id="unmute-btn" title="Ativar som">🔇</button>

  <div id="video-overlay">
    <a id="video-link" href="#" target="_blank" rel="noopener">Ver original no Instagram</a>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <a-assets>
      <video
        id="ar-video"
        src="assets/Unama-video.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <!--
      Troque o caminho abaixo pelos arquivos .fset / .fset3 / .iset
      gerados a partir da SUA imagem. Não coloque a extensão.
    -->
    <a-nft
      type="nft"
      url="assets/marker/pattern-marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="target"
    >
      <!--
        width/height definem o tamanho do plano em relação ao marcador NFT
        (a imagem escaneada é normalizada para width=1 pelo AR.js).
        Ajuste "height" para bater com a proporção real da sua imagem/vídeo:
        height = altura_da_imagem / largura_da_imagem
      -->
      <!-- TESTE TEMPORÁRIO: caixa vermelha no lugar do vídeo, pra confirmar se algo aparece nessa posição -->
      <a-box
        color="red"
        width="0.3"
        height="0.3"
        depth="0.3"
        position="0.5 0.28 0.15"
      ></a-box>

      <!--
      <a-video
        src="#ar-video"
        width="1"
        height="0.5625"
        position="0.5 0.28 0.01"
        rotation="0 0 0"
      ></a-video>
      -->
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const INSTAGRAM_VIDEO_URL = "https://www.instagram.com/reel/SEU_LINK_AQUI/";

    const target = document.querySelector('#target');
    const overlay = document.querySelector('#video-overlay');
    const hint = document.querySelector('#hint');
    const link = document.querySelector('#video-link');
    const video = document.querySelector('#ar-video');
    const unmuteBtn = document.querySelector('#unmute-btn');

    link.href = INSTAGRAM_VIDEO_URL;

    target.addEventListener('markerFound', () => {
      overlay.style.display = 'block';
      hint.style.display = 'none';
      unmuteBtn.style.display = 'block';
      video.currentTime = 0;
      video.play().catch(() => {});
    });

    target.addEventListener('markerLost', () => {
      overlay.style.display = 'none';
      hint.style.display = 'block';
      video.pause();
    });

    unmuteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔇' : '🔊';
      video.play();
    });
  </script>
</body>
</html>
