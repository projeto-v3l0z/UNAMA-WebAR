<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR - Vídeo do Instagram</title>

  <!-- A-Frame + MindAR (image tracking) -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    #video-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 22px;
      border-radius: 40px;
      text-align: center;
    }

    #video-overlay a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #video-overlay a::before {
      content: "▶";
    }

    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
    }

    #unmute-btn {
      display: none;
      position: fixed;
      z-index: 999;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div id="hint">Aponte a câmera para a imagem</div>

  <button id="unmute-btn" title="Ativar som">🔇</button>

  <div id="video-overlay">
    <a id="video-link" href="#" target="_blank" rel="noopener">Ver original no Instagram</a>
  </div>

  <!--
    imageTargetSrc aponta para o arquivo .mind (gerado a partir da SUA imagem
    no compilador do MindAR: https://hiukim.github.io/mind-ar-js-doc/tools/compile/)
  -->
  <a-scene
    mindar-image="imageTargetSrc: assets/marker/targets.mind; autoStart: true; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
  >
    <a-assets>
      <video
        id="ar-video"
        src="assets/Unama-video.webm"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
      ></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

    <!--
      targetIndex: 0 corresponde à primeira (e única, nesse caso) imagem
      que você compilou no arquivo targets.mind.
      O conteúdo filho aparece alinhado exatamente sobre a imagem rastreada.
    -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!--
        width/height: ajuste "height" para a proporção real da SUA imagem
        (height = altura_da_imagem / largura_da_imagem). width fica em 1.
      -->
      <a-video
        src="#ar-video"
        width="1"
        height="0.5625"
        position="0 0 0"
        rotation="0 0 0"
      ></a-video>
    </a-entity>
  </a-scene>

  <script>
    const INSTAGRAM_VIDEO_URL = "https://www.instagram.com/reel/SEU_LINK_AQUI/";

    const target = document.querySelector('#target');
    const overlay = document.querySelector('#video-overlay');
    const hint = document.querySelector('#hint');
    const link = document.querySelector('#video-link');
    const video = document.querySelector('#ar-video');
    const unmuteBtn = document.querySelector('#unmute-btn');

    link.href = INSTAGRAM_VIDEO_URL;

    // MindAR dispara "targetFound" / "targetLost" (não "markerFound"/"markerLost")
    target.addEventListener('targetFound', () => {
      overlay.style.display = 'block';
      hint.style.display = 'none';
      unmuteBtn.style.display = 'block';
      video.currentTime = 0;
      video.play().catch(() => {});
    });

    target.addEventListener('targetLost', () => {
      overlay.style.display = 'none';
      hint.style.display = 'block';
      video.pause();
    });

    unmuteBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      unmuteBtn.textContent = video.muted ? '🔇' : '🔊';
      video.play();
    });
  </script>
</body>
</html>
