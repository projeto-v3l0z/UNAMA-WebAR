<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>AR - Vídeo do Instagram</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Overlay que aparece quando a imagem é reconhecida */
    #video-overlay {
      display: none;
      position: fixed;
      z-index: 999;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 22px;
      border-radius: 40px;
      text-align: center;
    }

    #video-overlay a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #video-overlay a::before {
      content: "▶";
    }

    /* Player de vídeo local, centralizado na tela. */
    #video-player {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 640px);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #video-player video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #video-fallback {
      width: 100%;
      border: 0;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #073d36;
      cursor: pointer;
    }

    /* Dica antes de escanear */
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
    }
  </style>
</head>
<body>

  <div id="hint">Aponte a câmera para a imagem</div>

  <div id="video-overlay">
    <a id="video-link" href="#" target="_blank" rel="noopener">Assistir vídeo no Instagram</a>
  </div>

  <div id="video-player">
    <video id="ar-video" src="../assets/Unama-video.webm" playsinline controls preload="metadata"></video>
    <button id="video-fallback" hidden>Toque para reproduzir com som</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!--
      Troque os caminhos abaixo pelos arquivos .fset / .fset3 / .iset
      gerados a partir da SUA imagem (veja instruções abaixo do código).
      Não coloque a extensão, só o "nome-base" do arquivo.
    -->
    <a-nft
      type="nft"
      url="../assets/marker/pattern-marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="target"
    >
    </a-nft>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Link do vídeo do Instagram que você quer disponibilizar
    const INSTAGRAM_VIDEO_URL = "https://www.instagram.com/p/DbTMLwJlor8/?img_index=1";

    const target = document.querySelector('#target');
    const overlay = document.querySelector('#video-overlay');
    const hint = document.querySelector('#hint');
    const link = document.querySelector('#video-link');
    const player = document.querySelector('#video-player');
    const video = document.querySelector('#ar-video');
    const fallback = document.querySelector('#video-fallback');

    link.href = INSTAGRAM_VIDEO_URL;

    // Desbloqueio de mídia no mobile: primeiro toque/carregamento permite play() posterior.
    const unlock = () => { video.load(); };
    window.addEventListener('touchend', unlock, { once: true });
    window.addEventListener('click', unlock, { once: true });

    fallback.addEventListener('click', () => {
      video.muted = false;
      video.play().then(() => {
        fallback.hidden = true;
      }).catch(() => {});
    });

    function showVideo() {
      fallback.hidden = true;
      video.currentTime = 0;
      const attempt = video.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(() => {
          // Autoplay com som bloqueado: mostra botão para o usuário ativar.
          fallback.hidden = false;
        });
      }
    }

    target.addEventListener('markerFound', () => {
      overlay.style.display = 'block';
      player.style.display = 'block';
      hint.style.display = 'none';
      showVideo();
    });

    target.addEventListener('markerLost', () => {
      video.pause();
      player.style.display = 'none';
      fallback.hidden = true;
      overlay.style.display = 'none';
      hint.style.display = 'block';
    });
  </script>
</body>
</html>
