<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>UNAMA WebAR</title>

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
  <!-- animation-mixer para animar o personagem 3D (KAN-3) -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    /* Botão fallback caso o navegador bloqueie o áudio automático (KAN-3) */
    #audio-fallback {
      display: none;
      position: fixed;
      z-index: 999;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      color: #000;
      border: none;
      border-radius: 20px;
      padding: 12px 20px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Player de vídeo local, centralizado na tela. */
    #video-player {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 640px);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    #video-player video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    #video-fallback {
      width: 100%;
      border: 0;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #073d36;
      cursor: pointer;
    }

    /* Dica antes de escanear */
    #hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 999;
    }

    /* Rótulo com o nome da sala (KAN-5), exibido ao reconhecer o target de áudio */
    #room-label {
      display: none;
      position: fixed;
      z-index: 999;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #073d36;
      color: #fff;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="hint">Aponte a câmera para a imagem</div>

  <!-- Nome da sala reconhecida (KAN-5). Visível só com o target de áudio. -->
  <div id="room-label">📍 Laboratório L 101</div>

  <button id="audio-fallback" type="button">🔊 Ouvir apresentação</button>

  <!-- Narração da apresentação (KAN-3). Arquivo local em assets/audio/ -->
  <audio id="narration" src="../assets/audio/audio-unama.mp4" preload="auto" playsinline></audio>

  <!-- Áudio com o nome da sala (KAN-5). Tocado ao reconhecer o target de áudio. -->
  <audio id="room-audio" src="../assets/audio/audio-laboratorio.mp3" preload="auto" playsinline></audio>

  <!-- Player de vídeo local exibido ao reconhecer a imagem -->
  <div id="video-player">
    <video id="ar-video" src="../assets/Unama-video.webm" playsinline controls preload="metadata"></video>
    <button id="video-fallback" hidden>Toque para reproduzir com som</button>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >
    <!-- Três alvos NFT: vídeo no pattern-marker, personagem na
      imagem-personagem e áudio da sala na imagem-audio (KAN-5).
      Caminhos sem extensão, só o "nome-base" dos .fset/.fset3/.iset. -->
    <a-nft
      type="nft"
      url="../assets/marker/pattern-marker"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="target-video"
    >
    </a-nft>

    <a-nft
      type="nft"
      url="../assets/marker/imagem-personagem"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="target-character"
    >
      <!-- Personagem 3D apresentando a UNAMA (KAN-3). Modelo local em
        ../assets/models/personagem-unama-compressed.glb.
        Escala 170: modelo tem 1,0 de altura e o alvo tem 250 px,
        então o personagem cobre ~68% da altura da imagem. -->
      <a-entity
        id="character"
        gltf-model="#personagem"
        visible="false"
        position="0 0 0"
        rotation="0 0 90"
        scale="170 170 170"
        animation-mixer="loop: repeat"
      >
      </a-entity>
    </a-nft>

    <!-- Alvo 3 (imagem-audio): só o áudio com o nome da sala (KAN-5).
      Sem entidade 3D: o feedback visual é o rótulo #room-label. -->
    <a-nft
      type="nft"
      url="../assets/marker/imagem-audio"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      id="target-audio"
    >
    </a-nft>

    <a-assets>
      <a-asset-item id="personagem" src="../assets/models/personagem-unama-compressed.glb"></a-asset-item>
    </a-assets>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Personagem 3D definitivo da UNAMA (KAN-3), servido localmente.
    const MODEL_URL = "../assets/models/personagem-unama-compressed.glb";

    const targetVideo = document.querySelector('#target-video');
    const targetCharacter = document.querySelector('#target-character');
    const targetAudio = document.querySelector('#target-audio');
    const hint = document.querySelector('#hint');
    const character = document.querySelector('#character');
    const narration = document.querySelector('#narration');
    const roomAudio = document.querySelector('#room-audio');
    const roomLabel = document.querySelector('#room-label');
    const audioFallback = document.querySelector('#audio-fallback');
    const player = document.querySelector('#video-player');
    const video = document.querySelector('#ar-video');
    const fallback = document.querySelector('#video-fallback');

    // Aplica a URL do modelo ao asset (troca futura = mudar só MODEL_URL).
    document.querySelector('#personagem').setAttribute('src', MODEL_URL);

    // Desbloqueio de mídia no mobile: o primeiro toque carrega os elementos,
    // o play real acontece no evento markerFound.
    const unlockAudio = () => { narration.load(); roomAudio.load(); video.load(); };
    document.addEventListener('touchend', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    // Áudio pendente de toque manual (quando o navegador bloqueia o autoplay).
    // Aponta para narration ou roomAudio, conforme qual target foi reconhecido.
    let pendingAudio = null;

    function showAudioFallback(audio, text) {
      pendingAudio = audio;
      audioFallback.textContent = text;
      audioFallback.style.display = 'inline-block';
    }

    function hideAudioFallback(audio) {
      if (pendingAudio === null || pendingAudio === audio) {
        pendingAudio = null;
        audioFallback.style.display = 'none';
      }
    }

    function playNarration() {
      narration.currentTime = 0;
      const playPromise = narration.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Navegador bloqueou o autoplay: exibe botão manual.
          showAudioFallback(narration, '🔊 Ouvir apresentação');
        });
      }
    }

    // KAN-5: reproduz do zero o áudio com o nome da sala.
    function playRoomAudio() {
      roomAudio.currentTime = 0;
      const playPromise = roomAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Navegador bloqueou o autoplay: exibe botão manual.
          showAudioFallback(roomAudio, '🔊 Ouvir nome da sala');
        });
      }
    }

    audioFallback.addEventListener('click', () => {
      const audio = pendingAudio || narration;
      audioFallback.style.display = 'none';
      audio.play().catch(() => {
        audioFallback.style.display = 'inline-block';
      });
    });

    fallback.addEventListener('click', () => {
      video.muted = false;
      video.play().then(() => {
        fallback.hidden = true;
      }).catch(() => {});
    });

    function showVideo() {
      fallback.hidden = true;
      video.currentTime = 0;
      const attempt = video.play();
      if (attempt && typeof attempt.catch === 'function') {
        attempt.catch(() => {
          // Autoplay com som bloqueado: mostra botão para o usuário ativar.
          fallback.hidden = false;
        });
      }
    }

    // A dica some quando qualquer marcador é encontrado e volta
    // apenas quando todos são perdidos.
    let videoFound = false;
    let characterFound = false;
    let audioFound = false;
    function updateHint() {
      hint.style.display = (videoFound || characterFound || audioFound) ? 'none' : 'block';
    }

    // Alvo 1 (pattern-marker): só o vídeo.
    targetVideo.addEventListener('markerFound', () => {
      videoFound = true;
      updateHint();
      player.style.display = 'block';
      showVideo();
    });

    targetVideo.addEventListener('markerLost', () => {
      videoFound = false;
      updateHint();
      video.pause();
      player.style.display = 'none';
      fallback.hidden = true;
    });

    // Alvo 2 (imagem-personagem): personagem 3D + narração.
    targetCharacter.addEventListener('markerFound', () => {
      characterFound = true;
      updateHint();
      // KAN-3: exibe o personagem 3D e inicia a narração.
      character.setAttribute('visible', true);
      playNarration();
    });

    targetCharacter.addEventListener('markerLost', () => {
      characterFound = false;
      updateHint();
      hideAudioFallback(narration);
      // KAN-3: esconde o personagem e pausa a narração.
      character.setAttribute('visible', false);
      narration.pause();
    });

    // Alvo 3 (imagem-audio): rótulo com o nome da sala + áudio correspondente.
    targetAudio.addEventListener('markerFound', () => {
      audioFound = true;
      updateHint();
      // KAN-5: exibe o nome da sala e inicia o áudio do zero.
      roomLabel.style.display = 'block';
      playRoomAudio();
    });

    targetAudio.addEventListener('markerLost', () => {
      audioFound = false;
      updateHint();
      hideAudioFallback(roomAudio);
      // KAN-5: esconde o rótulo e interrompe o áudio ao perder o target.
      roomLabel.style.display = 'none';
      roomAudio.pause();
    });
  </script>
</body>
</html>
